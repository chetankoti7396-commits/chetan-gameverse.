<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Match | Chetan GameVerse</title><link rel="stylesheet" href="../style.css"></head>
<body><main class="game-page"><a class="back-link" href="../index.html">← Back to GameVerse</a><p class="eyebrow">BRAIN GAME</p><h1 class="game-title">Memory Match</h1><p class="game-intro">Find all eight matching pairs using as few moves as possible.</p><section class="game-shell"><div class="game-toolbar"><span class="score">Moves: <span id="moves">0</span></span><button class="game-btn" id="restart">Shuffle & Restart</button></div><div id="board" class="memory-board"></div><p id="status" class="status-message">Flip two cards to find a pair.</p></section></main>
<script>
const icons=['🐸','🚀','🍕','🦊','🎧','🌈','⚽','👾'];let deck=[],first=null,lock=false,moves=0,matched=0;const boardEl=document.getElementById('board'),statusEl=document.getElementById('status'),movesEl=document.getElementById('moves');
function start(){deck=[...icons,...icons].sort(()=>Math.random()-.5).map((icon,id)=>({icon,id,open:false,matched:false}));first=null;lock=false;moves=0;matched=0;movesEl.textContent=0;statusEl.textContent='Flip two cards to find a pair.';render()}
function render(){boardEl.innerHTML='';deck.forEach((card,i)=>{const b=document.createElement('button');b.className='memory-card-button'+(card.open?' open':'')+(card.matched?' matched':'');b.textContent=card.open||card.matched?card.icon:'?';b.setAttribute('aria-label',card.open||card.matched?card.icon:'Hidden card');b.disabled=card.matched;b.onclick=()=>flip(i);boardEl.appendChild(b)})}
function flip(i){if(lock||deck[i].open||deck[i].matched)return;deck[i].open=true;render();if(first===null){first=i;return}moves++;movesEl.textContent=moves;if(deck[first].icon===deck[i].icon){deck[first].matched=deck[i].matched=true;matched+=2;first=null;render();if(matched===deck.length)statusEl.textContent=`You matched every pair in ${moves} moves!`;else statusEl.textContent='Nice match! Find another pair.'}else{lock=true;const old=first;first=null;statusEl.textContent='Not a match — try again.';setTimeout(()=>{deck[old].open=false;deck[i].open=false;lock=false;render()},750)}}document.getElementById('restart').onclick=start;start();
</script></body></html>
