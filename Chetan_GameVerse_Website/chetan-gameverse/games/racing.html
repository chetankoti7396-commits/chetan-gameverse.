<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Racing | Chetan GameVerse</title><link rel="stylesheet" href="../style.css"></head>
<body><main class="game-page"><a class="back-link" href="../index.html">← Back to GameVerse</a><p class="eyebrow">RACING GAME</p><h1 class="game-title">Neon Racing</h1><p class="game-intro">Dodge the incoming cars and stay on the road for a high score.</p><section class="game-shell"><div class="game-toolbar"><span class="score">Score: <span id="score">0</span></span><button class="game-btn" id="start">Start / Restart</button></div><div class="canvas-wrap"><canvas id="road" width="320" height="500" aria-label="Car racing game"></canvas></div><div class="mobile-controls"><button class="game-btn" id="left">← Left</button><button class="game-btn" id="right">Right →</button></div><p class="race-instructions">Use ← → or A/D keys. On mobile, tap the buttons.</p><p id="status" class="status-message">Press Start to race.</p></section></main>
<script>
const c=document.getElementById('road'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),statusEl=document.getElementById('status');let player,traffic,score,frame,active=false,keys={};const lanes=[68,160,252];
function start(){player=1;traffic=[];score=0;frame=0;active=true;scoreEl.textContent=0;statusEl.textContent='Go! Dodge the traffic.';requestAnimationFrame(loop)}
function draw(){ctx.fillStyle='#10192b';ctx.fillRect(0,0,320,500);ctx.fillStyle='#1b2d3d';ctx.fillRect(28,0,264,500);ctx.fillStyle='#53e6e6';ctx.fillRect(24,0,4,500);ctx.fillRect(292,0,4,500);ctx.strokeStyle='#8b77ff';ctx.lineWidth=3;ctx.setLineDash([25,22]);ctx.lineDashOffset=-(frame%47);for(const x of [114,206]){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,500);ctx.stroke()}ctx.setLineDash([]);traffic.forEach(t=>car(lanes[t.lane],t.y,'#ff668f'));car(lanes[player],420,'#53e6e6')}
function car(x,y,color){ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=12;ctx.beginPath();ctx.roundRect(x-19,y-30,38,60,8);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#10172a';ctx.fillRect(x-12,y-19,24,13);ctx.fillRect(x-12,y+5,24,12);ctx.fillStyle='#f5f7ff';ctx.fillRect(x-15,y-27,7,4);ctx.fillRect(x+8,y-27,7,4)}
function loop(){if(!active)return;frame++;if((keys.left||keys.a)&&frame%8===0)player=Math.max(0,player-1);if((keys.right||keys.d)&&frame%8===0)player=Math.min(2,player+1);if(frame%48===0){let lane=Math.floor(Math.random()*3);traffic.push({lane,y:-40})}traffic.forEach(t=>t.y+=4+Math.min(score/120,4));traffic=traffic.filter(t=>t.y<550);if(traffic.some(t=>t.lane===player&&t.y>380&&t.y<465)){active=false;statusEl.textContent=`Crash! Final score: ${score}. Press Start to race again.`;draw();return}if(frame%6===0){score++;scoreEl.textContent=score}draw();requestAnimationFrame(loop)}
document.getElementById('start').onclick=start;document.getElementById('left').onpointerdown=()=>keys.left=true;document.getElementById('left').onpointerup=()=>keys.left=false;document.getElementById('left').onpointerleave=()=>keys.left=false;document.getElementById('right').onpointerdown=()=>keys.right=true;document.getElementById('right').onpointerup=()=>keys.right=false;document.getElementById('right').onpointerleave=()=>keys.right=false;document.addEventListener('keydown',e=>{if(['ArrowLeft','a','ArrowRight','d'].includes(e.key)){e.preventDefault();keys[e.key==='ArrowLeft'?'left':e.key==='ArrowRight'?'right':e.key]=true}});document.addEventListener('keyup',e=>{keys.left=false;keys.right=false;keys.a=false;keys.d=false});draw();
</script></body></html>
