<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake | Chetan GameVerse</title><link rel="stylesheet" href="../style.css"></head>
<body><main class="game-page"><a class="back-link" href="../index.html">← Back to GameVerse</a><p class="eyebrow">ARCADE GAME</p><h1 class="game-title">Snake</h1><p class="game-intro">Eat the glowing food, grow longer, and don't hit the walls or yourself.</p>
<section class="game-shell"><div class="game-toolbar"><span class="score">Score: <span id="score">0</span></span><button class="game-btn" id="start">Start / Restart</button></div><div class="canvas-wrap"><canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas></div><p class="game-help">Use arrow keys or WASD to move. On mobile, use the buttons below.</p><div class="mobile-controls"><button class="game-btn" data-dir="up">↑</button></div><div class="mobile-controls"><button class="game-btn" data-dir="left">←</button><button class="game-btn" data-dir="down">↓</button><button class="game-btn" data-dir="right">→</button></div><p id="message" class="status-message">Press Start to play.</p></section></main>
<script>
const c=document.getElementById('board'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),msg=document.getElementById('message');const cells=20,size=20;let snake,food,dir,nextDir,timer,score,running=false;
function reset(){clearInterval(timer);snake=[{x:8,y:10},{x:7,y:10},{x:6,y:10}];dir={x:1,y:0};nextDir={...dir};score=0;scoreEl.textContent=0;food=newFood();running=true;msg.textContent='Good luck!';draw();timer=setInterval(tick,125)}
function newFood(){let p;do{p={x:Math.floor(Math.random()*cells),y:Math.floor(Math.random()*cells)}}while(snake&&snake.some(s=>s.x===p.x&&s.y===p.y));return p}
function draw(){ctx.fillStyle='#080d1b';ctx.fillRect(0,0,400,400);ctx.strokeStyle='#ffffff0b';for(let i=0;i<=cells;i++){ctx.beginPath();ctx.moveTo(i*size,0);ctx.lineTo(i*size,400);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*size);ctx.lineTo(400,i*size);ctx.stroke()}ctx.fillStyle='#ff668f';ctx.shadowColor='#ff668f';ctx.shadowBlur=15;ctx.beginPath();ctx.arc(food.x*size+10,food.y*size+10,7,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;snake.forEach((s,i)=>{ctx.fillStyle=i?'#5f8cff':'#53e6e6';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=i?0:8;ctx.beginPath();ctx.roundRect(s.x*size+2,s.y*size+2,size-4,size-4,5);ctx.fill()});ctx.shadowBlur=0}
function tick(){dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.y<0||head.x>=cells||head.y>=cells||snake.some((s,i)=>i<snake.length-1&&s.x===head.x&&s.y===head.y)){clearInterval(timer);running=false;msg.textContent='Game over! Press Start to try again.';return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=10;scoreEl.textContent=score;food=newFood()}else snake.pop();draw()}
function turn(d){if(d.x!==-dir.x||d.y!==-dir.y)nextDir=d}
document.getElementById('start').onclick=reset;document.addEventListener('keydown',e=>{const m={ArrowUp:{x:0,y:-1},w:{x:0,y:-1},ArrowDown:{x:0,y:1},s:{x:0,y:1},ArrowLeft:{x:-1,y:0},a:{x:-1,y:0},ArrowRight:{x:1,y:0},d:{x:1,y:0}};if(m[e.key]){e.preventDefault();if(!running)reset();turn(m[e.key])}});document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{const m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};if(!running)reset();turn(m[b.dataset.dir])});reset();running=false;clearInterval(timer);msg.textContent='Press Start to play.';
</script></body></html>
