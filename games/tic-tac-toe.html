<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tic-Tac-Toe | Chetan GameVerse</title><link rel="stylesheet" href="../style.css"></head>
<body><main class="game-page"><a class="back-link" href="../index.html">← Back to GameVerse</a><p class="eyebrow">CLASSIC GAME</p><h1 class="game-title">Tic-Tac-Toe</h1><p class="game-intro">Play against a friend or challenge the computer.</p><section class="game-shell"><div class="game-toolbar"><label>Mode <select id="mode" class="game-btn"><option value="cpu">Vs Computer</option><option value="two">Two Players</option></select></label><button class="game-btn" id="reset">New Game</button></div><p id="status" class="tic-status">Your turn (X)</p><div id="board" class="tic-board"></div><p class="game-help">Get three of your marks in a row, column, or diagonal to win.</p></section></main>
<script>
const boardEl=document.getElementById('board'),statusEl=document.getElementById('status'),modeEl=document.getElementById('mode');let board=Array(9).fill(''),turn='X',over=false;const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function winner(b=board){for(const line of wins)if(b[line[0]]&&b[line[0]]===b[line[1]]&&b[line[1]]===b[line[2]])return b[line[0]];return b.every(Boolean)?'draw':null}
function render(){boardEl.innerHTML='';board.forEach((v,i)=>{const btn=document.createElement('button');btn.className='tic-cell';btn.textContent=v;btn.setAttribute('aria-label','Cell '+(i+1)+(v?', '+v:''));btn.onclick=()=>move(i);boardEl.appendChild(btn)});if(!over)statusEl.textContent=modeEl.value==='cpu'&&turn==='O'?'Computer is thinking…':`Player ${turn}'s turn`}
function move(i){if(over||board[i]||(modeEl.value==='cpu'&&turn==='O'))return;board[i]=turn;finishOrNext();if(!over&&modeEl.value==='cpu'&&turn==='O')setTimeout(cpuMove,350)}
function finishOrNext(){const w=winner();if(w){over=true;statusEl.textContent=w==='draw'?'It’s a draw!':(modeEl.value==='cpu'?(w==='X'?'You win!':'Computer wins!'):`Player ${w} wins!`);renderBoardOnly();return}turn=turn==='X'?'O':'X';render()}
function renderBoardOnly(){boardEl.querySelectorAll('button').forEach((b,i)=>{b.textContent=board[i];b.disabled=true})}
function cpuMove(){if(over)return;let empty=board.map((v,i)=>v?null:i).filter(v=>v!==null);let pick=null;for(const p of ['O','X']){for(const i of empty){const copy=board.slice();copy[i]=p;if(winner(copy)===p){pick=i;break}}if(pick!==null)break}if(pick===null&&board[4]==='')pick=4;if(pick===null)pick=empty[Math.floor(Math.random()*empty.length)];if(pick!==undefined)board[pick]='O';finishOrNext()}
function reset(){board=Array(9).fill('');turn='X';over=false;render()}document.getElementById('reset').onclick=reset;modeEl.onchange=reset;reset();
</script></body></html>
